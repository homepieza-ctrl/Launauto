plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'com.launcher.dd'
 compileSdk 34
 defaultConfig { applicationId 'com.launcher.dd'; minSdk 24; targetSdk 30; versionCode 1; versionName '1.0' }
 buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 kotlinOptions { jvmTarget = '1.8' }
}
dependencies { implementation 'org.osmdroid:osmdroid-android:6.1.18' }
